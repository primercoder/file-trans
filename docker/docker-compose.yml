services:
  kite-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    ports:
      - "8443:8443"
    volumes:
      - ./data:/data
    environment:
      KITE_BIND: 0.0.0.0:8443
      KITE_DB_PATH: /data/kite.db
      KITE_MAX_STORAGE_BYTES: ${KITE_MAX_STORAGE_BYTES:-10737418240}
