[package]
name = "kite-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10"
curve25519-dalek = "4"
ed25519-dalek = { version = "3", features = ["pem", "pkcs8", "rand_core"] }
hex = "0.4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "3", features = ["static_secrets"] }
